<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <!--
    圖文選單範本。格線與 scripts/richmenu.js 裡的 AREAS 座標完全對齊。
    欄寬 833（最右欄 834），列高 843。

    用法：
      1. 用瀏覽器開啟這個檔案 → 截圖或另存成 PNG，尺寸要維持 2500 x 1686
      2. 或交給設計同仁重畫，但每一格的位置不要動，否則民眾會點到隔壁格
      3. 存成 assets/richmenu.png 後跑 npm run richmenu:deploy

    字級刻意放大 —— 使用者多是長輩與照顧者。
  -->
  <defs>
    <style>
      .cell  { fill: #ffffff; stroke: #d8e0e5; stroke-width: 4; }
      .icon  { font-size: 150px; text-anchor: middle; dominant-baseline: central; }
      .label { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
               font-size: 88px; font-weight: 700; fill: #1a1a1a;
               text-anchor: middle; dominant-baseline: central; }
      .sub   { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
               font-size: 46px; fill: #7a8a95;
               text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="2500" height="1686" fill="#f4f6f8"/>

  <!-- 第一列 -->
  <rect class="cell" x="0"    y="0" width="833" height="843"/>
  <rect class="cell" x="833"  y="0" width="833" height="843"/>
  <rect class="cell" x="1666" y="0" width="834" height="843"/>

  <!-- 第二列 -->
  <rect class="cell" x="0"    y="843" width="833" height="843"/>
  <rect class="cell" x="833"  y="843" width="833" height="843"/>
  <rect class="cell" x="1666" y="843" width="834" height="843"/>

  <!-- 左上：補助申請流程 -->
  <text class="icon"  x="416" y="300">📋</text>
  <text class="label" x="416" y="470">補助申請</text>
  <text class="sub"   x="416" y="570">5 步驟怎麼跑</text>

  <!-- 中上：輔具借用 -->
  <text class="icon"  x="1249" y="300">🦽</text>
  <text class="label" x="1249" y="470">輔具借用</text>
  <text class="sub"   x="1249" y="570">短期 3 個月．免費</text>

  <!-- 右上：評估預約 -->
  <text class="icon"  x="2083" y="300">📅</text>
  <text class="label" x="2083" y="470">評估預約</text>
  <text class="sub"   x="2083" y="570">專人協助評估</text>

  <!-- 左下：有哪些輔具 -->
  <text class="icon"  x="416" y="1143">🔍</text>
  <text class="label" x="416" y="1313">有哪些輔具</text>
  <text class="sub"   x="416" y="1413">輪椅．助行器…</text>

  <!-- 中下：中心資訊 -->
  <text class="icon"  x="1249" y="1143">📍</text>
  <text class="label" x="1249" y="1313">中心資訊</text>
  <text class="sub"   x="1249" y="1413">地址．電話．時間</text>

  <!-- 右下：聯絡專人 -->
  <text class="icon"  x="2083" y="1143">💬</text>
  <text class="label" x="2083" y="1313">聯絡專人</text>
  <text class="sub"   x="2083" y="1413">留言或來電</text>
</svg>
